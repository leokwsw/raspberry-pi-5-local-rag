<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#c51a4a"/>
    <title>Local RAG — for use with Raspberry Pi 5</title>
    <script>
        try {
            const theme = localStorage.getItem('local-rag-theme')
            document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme :
                matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch {}
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
