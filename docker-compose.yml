services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333" ]
      interval: 10s
      timeout: 3s
      retries: 10

  chunking-service:
    build: ./chunking-service
    restart: unless-stopped
    environment:
      CHUNK_SIZE: "900"
      CHUNK_OVERLAP: "120"
    ports:
      - "8082:8082"

  reranker-service:
    build: ./reranker-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - reranker-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 10m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      qdrant:
        condition: service_healthy
      chunking-service:
        condition: service_started
      reranker-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant-data:
  reranker-models:
