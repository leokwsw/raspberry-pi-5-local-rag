[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-local-rag"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic-settings>=2.6", "python-multipart>=0.0.12", "psutil>=6", "uvicorn>=0.30"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
test = ["mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "types-psutil>=6"]

[tool.setuptools.packages.find]
include = ["local_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["local_rag"]
